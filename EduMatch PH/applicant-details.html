<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EduMatch PH — Applicant Details</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
  .admin-page { min-height: 100vh; background: var(--page-gradient); }
  .site-header { display: flex; align-items: center; gap: 1.5rem; padding: 1rem 2rem; background: var(--navy-900); color: #fff; position: sticky; top: 0; z-index: 20; }
  .brand { display: flex; align-items: center; gap: 0.5rem; color: #fff; font-family: 'Fraunces', serif; font-size: 1.2rem; font-weight: 600; text-decoration: none; }
  .brand img { display: block; width: auto; height: 50px; object-fit: contain; }
  .site-nav { display: flex; align-items: center; gap: 0.75rem; margin-left: auto; }
  .site-nav a { color: #DCE1EB; text-decoration: none; font-size: 0.82rem; font-weight: 600; padding: 0.6rem 0.8rem; border-radius: 8px; }
  .site-nav a:hover, .site-nav a[aria-current="page"] { background: rgba(255,255,255,0.08); color: var(--amber-500); }
  .logout-btn { font-family: inherit; background: none; border: 1px solid rgba(255,255,255,0.25); color: #fff; border-radius: 8px; padding: 0.55rem 1rem; cursor: pointer; }
  .content { max-width: 1100px; margin: 0 auto; padding: 2.5rem 1.5rem 4rem; }
  .title-row { display: flex; align-items: center; justify-content: space-between; gap: 1rem; margin-bottom: 1.25rem; }
  .title-row h1 { margin: 0; font-family: 'Fraunces', serif; font-size: 1.9rem; color: var(--navy-900); }
  .back-link { display: inline-flex; align-items: center; gap: 0.4rem; text-decoration: none; color: var(--navy-900); font-weight: 600; }
  .panel-grid { display: grid; grid-template-columns: 1.2fr 0.8fr; gap: 1.25rem; }
  .panel { background: #fff; border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow); padding: 1.25rem; }
  .panel h2 { margin: 0 0 1rem; font-size: 1.1rem; color: var(--navy-900); }
  .info-grid { display: grid; grid-template-columns: repeat(2, minmax(180px, 1fr)); gap: 0.8rem 1rem; }
  .meta { display: flex; flex-direction: column; gap: 0.2rem; }
  .meta .label { font-size: 0.72rem; color: var(--ink-muted); text-transform: uppercase; letter-spacing: 0.04em; }
  .meta .value { font-size: 0.96rem; color: var(--ink); font-weight: 600; }
  .criteria-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 0.7rem; }
  .criteria-list li { display: flex; align-items: center; gap: 0.7rem; font-size: 0.95rem; }
  .dot { width: 22px; height: 22px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; font-weight: 700; }
  .dot.pass { background: #E7F4EC; color: var(--success); }
  .dot.fail { background: #FBEAEA; color: var(--danger); }
  .status-box { margin-top: 1rem; padding: 0.9rem 1rem; border-radius: 10px; background: #F8F9FB; border: 1px solid var(--line); }
  .status-box strong { display: block; margin-bottom: 0.25rem; }
  .status-box.eligible { background: #E7F4EC; border-color: rgba(46,125,83,0.2); }
  .status-box.ineligible { background: #FBEAEA; border-color: rgba(194,59,59,0.2); }
  .ranking-box { margin-top: 1rem; }
  .ranking-factors { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 0.7rem; }
  .ranking-factors li { display: flex; flex-direction: column; gap: 0.3rem; }
  .progress-line { position: relative; width: 100%; height: 9px; border-radius: 999px; background: #EEECE3; overflow: hidden; }
  .progress-line span { position: absolute; inset: 0 auto 0 0; width: var(--value); background: var(--amber-500); border-radius: inherit; }
  .actions { display: flex; gap: 0.75rem; flex-wrap: wrap; margin-top: 1.2rem; }
  .btn-primary, .btn-secondary { font-family: inherit; border-radius: 8px; padding: 0.7rem 1rem; font-weight: 600; border: 1px solid var(--line); cursor: pointer; }
  .btn-primary { background: var(--amber-500); color: #17130A; border: none; }
  .btn-secondary { background: #fff; color: var(--navy-900); }
  @media (max-width: 760px) { .site-header { flex-wrap: wrap; padding: 1rem; } .site-nav { order: 3; width: 100%; justify-content: space-between; } .panel-grid { grid-template-columns: 1fr; } .info-grid { grid-template-columns: 1fr; } .title-row { flex-direction: column; align-items: flex-start; } }
</style>
</head>
<body>
<div class="admin-page">
  <header class="site-header">
    <a class="brand" href="dashboard.html"><img src="EduMatchPH_logo.jpg" alt="EduMatch PH"></a>
    <nav class="site-nav" aria-label="Main navigation">
      <a href="dashboard.html">Dashboard</a>
      <a href="scholarships.html">Scholarships</a>
      <a href="applicants.html">Applicants</a>
      <a href="ranking.html">Rankings</a>
      <a href="saved.html">Shortlisted Applicants</a>
    </nav>
    <button class="logout-btn" type="button" data-logout="true">Log out</button>
  </header>

  <main class="content">
    <div class="title-row">
      <h1 id="applicant-name">Applicant Details</h1>
      <a class="back-link" href="applicants.html" id="back-link">&larr; Back to applicants</a>
    </div>

    <div class="panel-grid">
      <section class="panel">
        <h2>Applicant Information</h2>
        <div class="info-grid" id="info-grid"></div>
      </section>

      <section class="panel">
        <h2>Eligibility Screening</h2>
        <ul class="criteria-list" id="criteria-list"></ul>
        <div class="status-box" id="status-box"></div>
        <div class="actions">
          <button class="btn-primary" type="button" id="shortlist-btn">Shortlist Applicant</button>
          <a class="btn-secondary" href="ranking.html" id="ranking-link">View Ranking</a>
        </div>
      </section>
    </div>

    <section class="panel ranking-box" id="ranking-panel" style="margin-top:1.25rem; display: none;">
      <h2>Ranking Explanation</h2>
      <div id="ranking-summary"></div>
      <ul class="ranking-factors" id="ranking-factors"></ul>
    </section>
  </main>
</div>

<script src="script.js"></script>
<script>
  if (!hasValidAdminSession()) {
    window.location.href = 'index.html';
  }

  const params = new URLSearchParams(window.location.search);
  const applicantId = params.get('applicant');
  const scholarshipId = params.get('scholarship') || getCurrentScholarshipId();
  const applicant = getApplicantDetails(applicantId) || (getApplicants(scholarshipId).find(item => item.id === applicantId) || null);
  const scholarship = getScholarship(scholarshipId);

  if (!applicant || !scholarship) {
    document.getElementById('applicant-name').textContent = 'Applicant Not Found';
    document.getElementById('info-grid').innerHTML = '<div class="muted">No applicant data found.</div>';
    throw new Error('Applicant not found');
  }

  document.getElementById('applicant-name').textContent = applicant.name;
  document.getElementById('back-link').href = `applicants.html?scholarship=${scholarshipId}`;

  const infoGrid = document.getElementById('info-grid');
  infoGrid.innerHTML = `
    <div class="meta"><span class="label">Applicant ID</span><span class="value">${applicant.id}</span></div>
    <div class="meta"><span class="label">Full Name</span><span class="value">${applicant.name}</span></div>
    <div class="meta"><span class="label">Course</span><span class="value">${applicant.course}</span></div>
    <div class="meta"><span class="label">Year Level</span><span class="value">${applicant.yearLevel}</span></div>
    <div class="meta"><span class="label">GPA</span><span class="value">${applicant.gpa}</span></div>
    <div class="meta"><span class="label">Household Income</span><span class="value">PHP ${Number(applicant.income || 0).toLocaleString()}</span></div>
    <div class="meta"><span class="label">Location</span><span class="value">${applicant.location}</span></div>
    <div class="meta"><span class="label">Citizenship</span><span class="value">${applicant.citizenship}</span></div>
  `;

  const criteriaMap = {
    'Minimum GPA requirement': 'minimumGpa',
    'Eligible course': 'eligibleCourse',
    'Income requirement': 'incomeRequirement',
    'Location requirement': 'locationRequirement',
    'Citizenship requirement': 'citizenshipRequirement'
  };

  const criteriaList = document.getElementById('criteria-list');
  const screening = applicant.screening || {};
  const statusBox = document.getElementById('status-box');
  const isEligible = applicant.eligibilityStatus === 'Eligible';

  const items = (scholarship.criteria || []).map((criterion) => {
    const key = criteriaMap[criterion];
    const passed = Boolean(key ? screening[key] : false);
    return `
      <li>
        <span class="dot ${passed ? 'pass' : 'fail'}">${passed ? '✓' : '✕'}</span>
        <span>${criterion}</span>
      </li>
    `;
  });

  criteriaList.innerHTML = items.join('');

  statusBox.className = `status-box ${isEligible ? 'eligible' : 'ineligible'}`;
  statusBox.innerHTML = `
    <strong>Eligibility Status: ${isEligible ? 'ELIGIBLE' : 'INELIGIBLE'}</strong>
    ${isEligible ? 'The applicant met all published screening criteria and can proceed to the ML ranking stage.' : 'The applicant did not satisfy one or more published eligibility criteria.'}
  `;

  if (applicant.rankingFactors && applicant.rankingFactors.length) {
    document.getElementById('ranking-panel').style.display = 'block';
    document.getElementById('ranking-summary').innerHTML = `
      <p><strong>Ranking Score:</strong> ${applicant.rankingScore}</p>
      <p><strong>Rank:</strong> #${applicant.rank} of ${getEligibleApplicants(scholarship.id).length} eligible applicants</p>
    `;
    document.getElementById('ranking-factors').innerHTML = applicant.rankingFactors.map(factor => `
      <li>
        <strong>${factor.name}</strong>
        <span>${factor.contribution} / ${factor.possible}</span>
        <div class="progress-line" style="--value: ${(factor.contribution / factor.possible) * 100}%">
          <span></span>
        </div>
      </li>
    `).join('');
  }

  document.getElementById('shortlist-btn').addEventListener('click', () => {
    shortlistApplicant(applicant.id, scholarship.id);
    document.getElementById('shortlist-btn').textContent = 'Shortlisted';
    document.getElementById('shortlist-btn').disabled = true;
  });
</script>
</body>
</html>
