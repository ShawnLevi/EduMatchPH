<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EduMatch PH — Applicants</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
  .admin-page { min-height: 100vh; background: var(--page-gradient); }
  .site-header {
    display: flex; align-items: center; gap: 1.5rem; padding: 1rem 2rem;
    background: var(--navy-900); color: #fff; position: sticky; top: 0; z-index: 20;
  }
  .brand { display: flex; align-items: center; gap: 0.5rem; color: #fff; font-family: 'Fraunces', serif; font-size: 1.2rem; font-weight: 600; text-decoration: none; }
  .brand img { display: block; width: auto; height: 50px; object-fit: contain; }
  .site-nav { display: flex; align-items: center; gap: 0.75rem; margin-left: auto; }
  .site-nav a { color: #DCE1EB; text-decoration: none; font-size: 0.82rem; font-weight: 600; padding: 0.6rem 0.8rem; border-radius: 8px; }
  .site-nav a:hover, .site-nav a[aria-current="page"] { background: rgba(255,255,255,0.08); color: var(--amber-500); }
  .logout-btn { font-family: inherit; background: none; border: 1px solid rgba(255,255,255,0.25); color: #fff; border-radius: 8px; padding: 0.55rem 1rem; cursor: pointer; }
  .content { max-width: 1180px; margin: 0 auto; padding: 2.5rem 1.5rem 4rem; }
  .topbar { display: flex; align-items: end; justify-content: space-between; gap: 1rem; margin-bottom: 1.5rem; }
  .topbar h1 { font-family: 'Fraunces', serif; margin: 0; font-size: 1.9rem; color: var(--navy-900); }
  .topbar p { margin: 0.35rem 0 0; color: var(--ink-muted); }
  .chip { display: inline-flex; align-items: center; padding: 0.5rem 0.8rem; background: #fff; border: 1px solid var(--line); border-radius: 999px; font-weight: 600; font-size: 0.8rem; color: var(--navy-900); }
  .stats { display: grid; grid-template-columns: repeat(4, minmax(200px, 1fr)); gap: 1rem; margin-bottom: 1.5rem; }
  .stat-card { background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 1rem 1.1rem; box-shadow: var(--shadow); }
  .stat-card .label { font-size: 0.75rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em; color: var(--ink-muted); }
  .stat-card .value { margin-top: 0.5rem; font-family: 'Fraunces', serif; font-size: 1.7rem; color: var(--navy-900); }
  .panel { background: #fff; border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow); overflow: hidden; }
  .panel-header { display: flex; align-items: center; justify-content: space-between; gap: 1rem; padding: 1rem 1.25rem; border-bottom: 1px solid var(--line); }
  .panel-header h2 { margin: 0; font-size: 1.1rem; color: var(--navy-900); }
  .filters { display: flex; align-items: center; gap: 0.75rem; }
  .filters select { font-family: inherit; font-size: 0.9rem; padding: 0.55rem 0.7rem; border-radius: 8px; border: 1px solid var(--line); }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 0.9rem 1rem; border-bottom: 1px solid var(--line); font-size: 0.9rem; }
  th { color: var(--ink-muted); text-transform: uppercase; letter-spacing: 0.03em; font-size: 0.7rem; }
  td { color: var(--ink); }
  .badge { display: inline-flex; align-items: center; justify-content: center; font-weight: 700; border-radius: 999px; padding: 0.38rem 0.7rem; font-size: 0.74rem; }
  .badge.eligible { background: #E7F4EC; color: var(--success); }
  .badge.ineligible { background: #FBEAEA; color: var(--danger); }
  .status-row { display: inline-flex; align-items: center; gap: 0.35rem; }
  .score { font-weight: 700; color: var(--navy-900); }
  .action-link { display: inline-block; padding: 0.5rem 0.8rem; text-decoration: none; border-radius: 8px; background: var(--amber-100); color: var(--navy-900); font-weight: 600; }
  .muted { color: var(--ink-muted); }
  @media (max-width: 900px) { .stats { grid-template-columns: repeat(2, 1fr); } .panel { overflow-x: auto; } }
  @media (max-width: 640px) { .site-header { flex-wrap: wrap; padding: 1rem; } .site-nav { order: 3; width: 100%; justify-content: space-between; overflow-x: auto; } .topbar { flex-direction: column; align-items: flex-start; } .stats { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<div class="admin-page">
  <header class="site-header">
    <a class="brand" href="dashboard.html"><img src="EduMatchPH_logo.jpg" alt="EduMatch PH"></a>
    <nav class="site-nav" aria-label="Main navigation">
      <a href="dashboard.html">Dashboard</a>
      <a href="scholarships.html">Scholarships</a>
      <a href="applicants.html" aria-current="page">Applicants</a>
      <a href="ranking.html">Rankings</a>
      <a href="saved.html">Shortlisted Applicants</a>
    </nav>
    <button class="logout-btn" type="button" data-logout="true">Log out</button>
  </header>

  <main class="content">
    <div class="topbar">
      <div>
        <h1 id="scholarship-title">Applicant Review</h1>
        <p id="scholarship-subtitle">Opportunity and screening summary</p>
      </div>
      <span class="chip" id="status-chip">Screening status: In progress</span>
    </div>

    <section class="stats" id="stat-grid"></section>

    <section class="panel">
      <div class="panel-header">
        <h2>Applicant list</h2>
        <div class="filters">
          <label>
            <select id="filter-status">
              <option value="all">All</option>
              <option value="Eligible">Eligible</option>
              <option value="Ineligible">Ineligible</option>
            </select>
          </label>
        </div>
      </div>
      <div style="overflow-x:auto;">
        <table>
          <thead>
            <tr>
              <th>Rank</th>
              <th>Applicant</th>
              <th>GPA</th>
              <th>Course</th>
              <th>Income</th>
              <th>Location</th>
              <th>Eligibility</th>
              <th>Ranking Score</th>
              <th>Action</th>
            </tr>
          </thead>
          <tbody id="applicant-table-body"></tbody>
        </table>
      </div>
    </section>
  </main>
</div>

<script src="script.js"></script>
<script>
  if (!hasValidAdminSession()) {
    window.location.href = 'index.html';
  }

  const params = new URLSearchParams(window.location.search);
  const selectedScholarshipId = params.get('scholarship') || getCurrentScholarshipId();
  setCurrentScholarship(selectedScholarshipId);
  const scholarship = getScholarship(selectedScholarshipId);

  const titleEl = document.getElementById('scholarship-title');
  const subtitleEl = document.getElementById('scholarship-subtitle');
  const statusChip = document.getElementById('status-chip');
  const tableBody = document.getElementById('applicant-table-body');
  const statGrid = document.getElementById('stat-grid');

  if (!scholarship) {
    titleEl.textContent = 'No scholarship selected';
    subtitleEl.textContent = 'Choose a scholarship to review applicants.';
    tableBody.innerHTML = '<tr><td colspan="9" class="muted">No application data available.</td></tr>';
    throw new Error('No scholarship data available');
  }

  titleEl.textContent = scholarship.name;
  subtitleEl.textContent = `${scholarship.provider} • ${scholarship.deadline}`;
  statusChip.textContent = `Screening status: ${scholarship.status}`;

  const totalApplications = scholarship.applications || (scholarship.applicants || []).length;
  const eligibleCount = getEligibleApplicants(scholarship.id).length;
  const ineligibleCount = (scholarship.applicants || []).length - eligibleCount;
  const slots = scholarship.availableSlots || 0;

  statGrid.innerHTML = `
    <div class="stat-card">
      <div class="label">Total Applications</div>
      <div class="value">${totalApplications}</div>
    </div>
    <div class="stat-card">
      <div class="label">Eligible</div>
      <div class="value">${eligibleCount}</div>
    </div>
    <div class="stat-card">
      <div class="label">Ineligible</div>
      <div class="value">${ineligibleCount}</div>
    </div>
    <div class="stat-card">
      <div class="label">Available Slots</div>
      <div class="value">${slots}</div>
    </div>
  `;

  const filterSelect = document.getElementById('filter-status');

  function renderTable(filter = 'all') {
    const applicants = getApplicants(scholarship.id);
    const visibleApplicants = filter === 'all' ? applicants : applicants.filter(applicant => applicant.eligibilityStatus === filter);

    if (!visibleApplicants.length) {
      tableBody.innerHTML = '<tr><td colspan="9" class="muted">No applicants match the current filter.</td></tr>';
      return;
    }

    tableBody.innerHTML = visibleApplicants.map(applicant => {
      const rank = applicant.rank ?? '—';
      const score = applicant.rankingScore ?? '—';
      const badgeClass = applicant.eligibilityStatus === 'Eligible' ? 'eligible' : 'ineligible';
      return `
        <tr>
          <td>${rank}</td>
          <td><strong>${applicant.name}</strong></td>
          <td>${applicant.gpa}</td>
          <td>${applicant.course}</td>
          <td>PHP ${Number(applicant.income || 0).toLocaleString()}</td>
          <td>${applicant.location}</td>
          <td><span class="badge ${badgeClass}">${applicant.eligibilityStatus}</span></td>
          <td class="score">${score === '—' ? '—' : `${score}`}</td>
          <td><a class="action-link" href="applicant-details.html?applicant=${applicant.id}&scholarship=${scholarship.id}">View</a></td>
        </tr>
      `;
    }).join('');
  }

  filterSelect.addEventListener('change', event => {
    renderTable(event.target.value);
  });

  renderTable('all');
</script>
</body>
</html>
