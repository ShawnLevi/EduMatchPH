<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EduMatch PH — Ranking</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
  .admin-page { min-height: 100vh; background: var(--page-gradient); }
  .site-header { display: flex; align-items: center; gap: 1.5rem; padding: 1rem 2rem; background: var(--navy-900); color: #fff; position: sticky; top: 0; z-index: 20; }
  .brand { display: flex; align-items: center; gap: 0.5rem; color: #fff; font-family: 'Fraunces', serif; font-size: 1.2rem; font-weight: 600; text-decoration: none; }
  .brand img { display: block; width: auto; height: 50px; object-fit: contain; }
  .site-nav { display: flex; align-items: center; gap: 0.75rem; margin-left: auto; }
  .site-nav a { color: #DCE1EB; text-decoration: none; font-size: 0.82rem; font-weight: 600; padding: 0.6rem 0.8rem; border-radius: 8px; }
  .site-nav a:hover, .site-nav a[aria-current="page"] { background: rgba(255,255,255,0.08); color: var(--amber-500); }
  .logout-btn { font-family: inherit; background: none; border: 1px solid rgba(255,255,255,0.25); color: #fff; border-radius: 8px; padding: 0.55rem 1rem; cursor: pointer; }
  .content { max-width: 1180px; margin: 0 auto; padding: 2.5rem 1.5rem 4rem; }
  .topbar { display: flex; align-items: end; justify-content: space-between; gap: 1rem; margin-bottom: 1.25rem; }
  .topbar h1 { margin: 0; font-family: 'Fraunces', serif; font-size: 1.9rem; color: var(--navy-900); }
  .topbar p { margin: 0.35rem 0 0; color: var(--ink-muted); }
  .stats { display: grid; grid-template-columns: repeat(4, minmax(200px, 1fr)); gap: 1rem; margin-bottom: 1.5rem; }
  .stat-card { background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 1rem 1.1rem; box-shadow: var(--shadow); }
  .stat-card .label { font-size: 0.74rem; letter-spacing: 0.04em; text-transform: uppercase; color: var(--ink-muted); }
  .stat-card .value { margin-top: 0.5rem; font-size: 1.7rem; font-family: 'Fraunces', serif; color: var(--navy-900); }
  .panel { background: #fff; border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow); overflow: hidden; }
  .panel-header { display: flex; align-items: center; justify-content: space-between; gap: 1rem; padding: 1rem 1.25rem; border-bottom: 1px solid var(--line); }
  .panel-header h2 { margin: 0; font-size: 1.1rem; color: var(--navy-900); }
  .panel-header .chip { display: inline-flex; align-items: center; padding: 0.5rem 0.8rem; background: var(--amber-100); border-radius: 999px; font-weight: 700; color: var(--navy-900); font-size: 0.76rem; }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 0.9rem 1rem; border-bottom: 1px solid var(--line); font-size: 0.9rem; }
  th { text-transform: uppercase; letter-spacing: 0.03em; color: var(--ink-muted); font-size: 0.7rem; }
  .badge { display: inline-flex; align-items: center; padding: 0.38rem 0.7rem; border-radius: 999px; font-weight: 700; font-size: 0.74rem; }
  .badge.eligible { background: #E7F4EC; color: var(--success); }
  .score { font-weight: 700; color: var(--navy-900); }
  .action-link { display: inline-block; background: var(--amber-100); color: var(--navy-900); text-decoration: none; padding: 0.5rem 0.8rem; border-radius: 8px; font-weight: 600; }
  @media (max-width: 900px) { .stats { grid-template-columns: repeat(2, 1fr); } }
  @media (max-width: 640px) { .site-header { flex-wrap: wrap; padding: 1rem; } .site-nav { order: 3; width: 100%; justify-content: space-between; overflow-x: auto; } .topbar { flex-direction: column; align-items: flex-start; } .stats { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<div class="admin-page">
  <header class="site-header">
    <a class="brand" href="dashboard.html"><img src="EduMatchPH_logo.jpg" alt="EduMatch PH"></a>
    <nav class="site-nav" aria-label="Main navigation">
      <a href="dashboard.html">Dashboard</a>
      <a href="scholarships.html">Scholarships</a>
      <a href="applicants.html">Applicants</a>
      <a href="ranking.html" aria-current="page">Rankings</a>
      <a href="saved.html">Shortlisted Applicants</a>
    </nav>
    <button class="logout-btn" type="button" data-logout="true">Log out</button>
  </header>

  <main class="content">
    <div class="topbar">
      <div>
        <h1 id="ranking-title">Applicant Ranking</h1>
        <p id="ranking-subtitle">Machine-learning ranking for eligible applicants</p>
      </div>
      <span class="chip" id="ranking-status">Ranking status: Complete</span>
    </div>

    <section class="stats" id="ranking-stats"></section>

    <section class="panel">
      <div class="panel-header">
        <h2 id="panel-heading">Ranked applicants</h2>
        <span class="chip">Ranking Score</span>
      </div>
      <div style="overflow-x:auto;">
      <table>
        <thead>
          <tr>
            <th>Rank</th>
            <th>Applicant</th>
            <th>Eligibility</th>
            <th>Ranking Score</th>
            <th>Action</th>
          </tr>
        </thead>
        <tbody id="ranking-body"></tbody>
      </table>
      </div>
    </section>
  </main>
</div>

<script src="script.js"></script>
<script>
  if (!hasValidAdminSession()) {
    window.location.href = 'index.html';
  }

  const currentScholarshipId = getCurrentScholarshipId();
  const scholarship = getScholarship(currentScholarshipId);
  const rankingData = getRanking(currentScholarshipId);

  document.getElementById('ranking-title').textContent = scholarship ? scholarship.name : 'Applicant Ranking';
  document.getElementById('ranking-subtitle').textContent = scholarship ? `${scholarship.provider} • Available Slots: ${scholarship.availableSlots}` : 'No scholarship selected';
  document.getElementById('ranking-status').textContent = `Ranking status: ${rankingData.length ? 'Complete' : 'Not Started'}`;

  const statsEl = document.getElementById('ranking-stats');
  statsEl.innerHTML = `
    <div class="stat-card">
      <div class="label">Available Slots</div>
      <div class="value">${scholarship ? scholarship.availableSlots : 0}</div>
    </div>
    <div class="stat-card">
      <div class="label">Eligible Applicants</div>
      <div class="value">${rankingData.length}</div>
    </div>
    <div class="stat-card">
      <div class="label">Ranking Required</div>
      <div class="value">${scholarship && scholarship.availableSlots ? (rankingData.length > scholarship.availableSlots ? 'Yes' : 'No') : 'N/A'}</div>
    </div>
    <div class="stat-card">
      <div class="label">Processed</div>
      <div class="value">${rankingData.length ? 'Yes' : 'No'}</div>
    </div>
  `;

  const ratingBody = document.getElementById('ranking-body');
  if (!rankingData.length) {
    ratingBody.innerHTML = '<tr><td colspan="5">No ranked applicants available.</td></tr>';
  } else {
    ratingBody.innerHTML = rankingData.map(applicant => `
      <tr>
        <td>#${applicant.rank}</td>
        <td>${applicant.name}</td>
        <td><span class="badge eligible">Eligible</span></td>
        <td class="score">${applicant.rankingScore}</td>
        <td><a class="action-link" href="applicant-details.html?applicant=${applicant.id}&scholarship=${currentScholarshipId}">View</a></td>
      </tr>
    `).join('');
  }
</script>
</body>
</html>
