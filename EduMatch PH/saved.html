<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EduMatch PH — Shortlisted Applicants</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
  .page-shell { min-height: 100vh; background: var(--page-gradient); }
  .site-header { display: flex; align-items: center; gap: 1.5rem; padding: 1rem 2rem; background: var(--navy-900); color: #fff; }
  .brand { color: #fff; font-family: 'Fraunces', serif; font-size: 1.2rem; font-weight: 600; text-decoration: none; }
  .brand img { display: block; width: auto; height: 50px; object-fit: contain; }
  .site-nav { display: flex; align-items: center; gap: 0.75rem; margin-left: auto; }
  .site-nav a { color: #DCE1EB; text-decoration: none; font-size: 0.82rem; font-weight: 600; padding: 0.6rem 0.8rem; border-radius: 8px; }
  .site-nav a:hover, .site-nav a[aria-current="page"] { background: rgba(255,255,255,0.08); color: var(--amber-500); }
  .logout-btn { font-family: inherit; font-size: 0.85rem; font-weight: 600; background: none; border: 1px solid rgba(255,255,255,0.3); color: #fff; padding: 0.5rem 1rem; border-radius: 8px; cursor: pointer; }
  .logout-btn:hover { background: rgba(255,255,255,0.1); }
  .content { max-width: 1100px; margin: 0 auto; padding: 2.5rem 1.5rem 4rem; }
  .page-head { display: flex; align-items: center; justify-content: space-between; gap: 1rem; margin-bottom: 1.25rem; }
  .page-head h1 { margin: 0; font-family: 'Fraunces', serif; font-size: 1.9rem; color: var(--navy-900); }
  .page-head .chip { display: inline-flex; align-items: center; padding: 0.5rem 0.8rem; font-size: 0.75rem; font-weight: 700; border-radius: 999px; background: #fff; border: 1px solid var(--line); color: var(--navy-900); }
  .panel { background: #fff; border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow); overflow: hidden; }
  table { width: 100%; border-collapse: collapse; }
  th, td { padding: 0.9rem 1rem; border-bottom: 1px solid var(--line); text-align: left; font-size: 0.9rem; }
  th { text-transform: uppercase; letter-spacing: 0.04em; font-size: 0.7rem; color: var(--ink-muted); }
  .badge { display: inline-flex; padding: 0.38rem 0.7rem; border-radius: 999px; font-weight: 700; font-size: 0.72rem; }
  .badge.eligible { background: #E7F4EC; color: var(--success); }
  .muted { color: var(--ink-muted); }
  .empty-state { background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 2rem; text-align: center; }
  .empty-state h2 { margin: 0 0 0.5rem; color: var(--navy-900); }
  @media (max-width: 640px) { .site-header { flex-wrap: wrap; padding: 1rem; } .site-nav { order: 3; width: 100%; justify-content: space-between; overflow-x: auto; } .page-head { flex-direction: column; align-items: flex-start; } }
</style>
</head>
<body>
<div class="page-shell">
  <header class="site-header">
    <a class="brand" href="dashboard.html"><img src="EduMatchPH_logo.jpg" alt="EduMatch PH"></a>
    <nav class="site-nav" aria-label="Main navigation">
      <a href="dashboard.html">Dashboard</a>
      <a href="scholarships.html">Scholarships</a>
      <a href="applicants.html">Applicants</a>
      <a href="ranking.html">Rankings</a>
      <a href="saved.html" aria-current="page">Shortlisted Applicants</a>
    </nav>
    <button class="logout-btn" type="button" data-logout="true">Log out</button>
  </header>

  <main class="content">
    <div class="page-head">
      <h1>Shortlisted Applicants</h1>
      <span class="chip" id="shortlist-count">0 total</span>
    </div>

    <section id="shortlist-panel" class="panel" style="display:none;">
      <div style="overflow-x:auto;">
        <table>
          <thead>
            <tr>
              <th>Applicant</th>
              <th>Scholarship</th>
              <th>Rank</th>
              <th>Ranking Score</th>
              <th>Eligibility</th>
              <th>Date Shortlisted</th>
            </tr>
          </thead>
          <tbody id="shortlist-body"></tbody>
        </table>
      </div>
    </section>

    <section id="shortlist-empty" class="empty-state" style="display:none;">
      <h2>No shortlisted applicants yet</h2>
      <p class="muted">Use the shortlist action from an applicant record to add candidates for administrative review.</p>
    </section>
  </main>
</div>

<script src="script.js"></script>
<script>
  const currentAdmin = localStorage.getItem('edumatch_admin_current_user');
  if (!currentAdmin) {
    window.location.href = 'index.html';
  }

  const shortlist = getShortlist();
  const shortlistCount = document.getElementById('shortlist-count');
  const shortlistPanel = document.getElementById('shortlist-panel');
  const shortlistEmpty = document.getElementById('shortlist-empty');
  const shortlistBody = document.getElementById('shortlist-body');

  shortlistCount.textContent = `${shortlist.length} total`;

  if (!shortlist.length) {
    shortlistEmpty.style.display = 'block';
  } else {
    shortlistPanel.style.display = 'block';
    shortlistBody.innerHTML = shortlist.map(item => `
      <tr>
        <td><strong>${item.applicantName}</strong></td>
        <td>${item.scholarshipName}</td>
        <td>${item.rank}</td>
        <td>${item.rankingScore}</td>
        <td><span class="badge eligible">${item.eligibilityStatus}</span></td>
        <td>${item.dateShortlisted}</td>
      </tr>
    `).join('');
  }
</script>
</body>
</html>
