<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EduMatch PH — Applicant Comparison</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
  .page-shell { min-height: 100vh; background: var(--page-gradient); }
  .site-header { display: flex; align-items: center; gap: 1.5rem; padding: 1rem 2rem; background: var(--navy-900); color: #fff; }
  .brand { color: #fff; font-family: 'Fraunces', serif; font-size: 1.2rem; font-weight: 600; text-decoration: none; }
  .brand img { display: block; width: auto; height: 50px; object-fit: contain; }
  .site-nav { display: flex; align-items: center; gap: 0.75rem; margin-left: auto; }
  .site-nav a { color: #DCE1EB; text-decoration: none; font-size: 0.82rem; font-weight: 600; padding: 0.6rem 0.8rem; border-radius: 8px; }
  .site-nav a:hover, .site-nav a[aria-current="page"] { background: rgba(255,255,255,0.08); color: var(--amber-500); }
  .logout-btn { font-family: inherit; font-size: 0.85rem; font-weight: 600; background: none; border: 1px solid rgba(255,255,255,0.3); color: #fff; padding: 0.5rem 1rem; border-radius: 8px; cursor: pointer; }
  .logout-btn:hover { background: rgba(255,255,255,0.1); }
  .content { max-width: 1100px; margin: 0 auto; padding: 2.5rem 1.5rem 4rem; }
  .page-head { display: flex; align-items: center; justify-content: space-between; gap: 1rem; margin-bottom: 1.25rem; }
  .page-head h1 { margin: 0; font-family: 'Fraunces', serif; font-size: 1.9rem; color: var(--navy-900); }
  .panel { background: #fff; border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow); padding: 1.25rem; }
  .selectors { display: flex; gap: 0.75rem; align-items: center; flex-wrap: wrap; margin-bottom: 1rem; }
  select { font-family: inherit; padding: 0.55rem 0.7rem; border-radius: 8px; border: 1px solid var(--line); }
  .compare-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 1rem; }
  .compare-card { background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 1rem; }
  .compare-card h3 { margin: 0 0 0.6rem; font-size: 1rem; color: var(--navy-900); }
  .compare-card dl { margin: 0; display: grid; gap: 0.5rem; }
  .compare-card dt { color: var(--ink-muted); font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.04em; }
  .compare-card dd { margin: 0; font-weight: 600; }
  .muted { color: var(--ink-muted); }
  @media (max-width: 640px) { .site-header { flex-wrap: wrap; padding: 1rem; } .site-nav { order: 3; width: 100%; justify-content: space-between; overflow-x: auto; } .page-head { flex-direction: column; align-items: flex-start; } }
</style>
</head>
<body>
<div class="page-shell">
  <header class="site-header">
    <a class="brand" href="dashboard.html"><img src="EduMatchPH_logo.jpg" alt="EduMatch PH"></a>
    <nav class="site-nav" aria-label="Main navigation">
      <a href="dashboard.html">Dashboard</a>
      <a href="scholarships.html">Scholarships</a>
      <a href="applicants.html">Applicants</a>
      <a href="ranking.html">Rankings</a>
      <a href="saved.html">Shortlisted Applicants</a>
    </nav>
    <button class="logout-btn" type="button" data-logout="true">Log out</button>
  </header>

  <main class="content">
    <div class="page-head">
      <h1>Compare Applicants</h1>
      <span class="muted">Eligible applicants only</span>
    </div>

    <section class="panel">
      <div class="selectors">
        <label>
          <span class="muted">Select applicants</span><br>
          <select id="compare-select-1"></select>
        </label>
        <label>
          <select id="compare-select-2"></select>
        </label>
        <label>
          <select id="compare-select-3"></select>
        </label>
      </div>
      <div id="compare-results" class="compare-grid"></div>
    </section>
  </main>
</div>

<script src="script.js"></script>
<script>
  const currentAdmin = localStorage.getItem('edumatch_admin_current_user');
  if (!currentAdmin) {
    window.location.href = 'index.html';
  }

  const scholarship = getScholarship(getCurrentScholarshipId());
  const eligibleApplicants = getEligibleApplicants(getCurrentScholarshipId());
  const selects = [document.getElementById('compare-select-1'), document.getElementById('compare-select-2'), document.getElementById('compare-select-3')];

  function populateSelects() {
    selects.forEach(select => {
      select.innerHTML = '<option value="">Select applicant</option>' + eligibleApplicants.map(applicant => `<option value="${applicant.id}">${applicant.name}</option>`).join('');
    });
  }

  function renderComparison() {
    const selectedIds = selects.map(select => select.value).filter(Boolean);
    const selectedApplicants = eligibleApplicants.filter(applicant => selectedIds.includes(applicant.id));
    const results = document.getElementById('compare-results');

    if (!selectedApplicants.length) {
      results.innerHTML = '<div class="muted">Choose one or more eligible applicants to compare.</div>';
      return;
    }

    results.innerHTML = selectedApplicants.map(applicant => `
      <div class="compare-card">
        <h3>${applicant.name}</h3>
        <dl>
          <div><dt>GPA</dt><dd>${applicant.gpa}</dd></div>
          <div><dt>Course</dt><dd>${applicant.course}</dd></div>
          <div><dt>Income</dt><dd>PHP ${Number(applicant.income || 0).toLocaleString()}</dd></div>
          <div><dt>Location</dt><dd>${applicant.location}</dd></div>
          <div><dt>Eligibility</dt><dd>${applicant.eligibilityStatus}</dd></div>
          <div><dt>Ranking Score</dt><dd>${applicant.rankingScore ?? 'Pending'}</dd></div>
          <div><dt>Rank</dt><dd>${applicant.rank ?? 'Pending'}</dd></div>
        </dl>
      </div>
    `).join('');
  }

  populateSelects();
  selects.forEach(select => select.addEventListener('change', renderComparison));
  renderComparison();
</script>
</body>
</html>
