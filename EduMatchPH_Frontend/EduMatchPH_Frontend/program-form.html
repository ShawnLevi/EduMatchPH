<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Program — EduMatch PH</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css"></head>
<body><div id="shell"></div><main class="wrap">
<h1 id="form-title">New scholarship program</h1>
<p class="lede">These are the rules the system uses. Every field is needed, also when editing.</p>
<form id="program-form" class="card" novalidate>
  <div class="grid2">
    <div class="field"><label for="scholarship_name">Program name</label><input type="text" id="scholarship_name"></div>
    <div class="field"><label for="provider">Provider</label><input type="text" id="provider"></div>
    <div class="field"><label for="grade_scale">Grade scale</label><select id="grade_scale"></select>
      <span class="hint" id="grade-scale-hint"></span></div>
    <div class="field"><label for="gwa_limit">GWA limit (worst grade accepted)</label>
      <input type="number" id="gwa_limit" step="any"></div>
    <div class="field"><label for="income_cap">Household income cap (PHP)</label><input type="number" id="income_cap" min="0"></div>
    <div class="field"><label for="min_entrance">Minimum entrance score (0-100)</label><input type="number" id="min_entrance" min="0" max="100"></div>
    <div class="field"><label for="eligible_field">Eligible field</label><select id="eligible_field"></select></div>
    <div class="field"><label for="location_req">Location requirement</label><select id="location_req"></select></div>
    <div class="field"><label for="available_slots">Available slots</label><input type="number" id="available_slots" min="0"></div>
    <div class="field"><label for="status">Status</label><select id="status"></select></div>
    <div class="field"><label for="application_deadline">Application deadline (optional)</label><input type="date" id="application_deadline"></div>
  </div>
  <div class="field" style="margin-top:1rem"><label>Eligible year levels</label>
    <div class="years">
      <label><input type="checkbox" name="eligible_years" value="1"> 1st</label>
      <label><input type="checkbox" name="eligible_years" value="2"> 2nd</label>
      <label><input type="checkbox" name="eligible_years" value="3"> 3rd</label>
      <label><input type="checkbox" name="eligible_years" value="4"> 4th</label>
    </div></div>
  <div class="note">The grade scale is locked once the program has applicants. Changing a rule clears the earlier screening and ranking.</div>
  <div class="toolbar" style="margin-top:1rem"><button class="btn-primary" type="submit">Save program</button>
    <a class="btn-secondary small" href="programs.html">Back</a></div>
  <div id="program-message" class="msg"></div>
</form>
</main>
<script src="app.js"></script>
<script>
const editingId = getScholarshipIdFromUrl();
renderShell(editingId ? "edit" : "new");
const RULE_FIELDS = ["grade_scale", "gwa_limit", "income_cap", "eligible_field",
                     "eligible_years", "location_req", "min_entrance"];
let original = null;

function showScaleHint() {
  const scale = GRADE_SCALES[document.getElementById("grade_scale").value];
  const limit = document.getElementById("gwa_limit");
  document.getElementById("grade-scale-hint").textContent = scaleHintText(scale);
  if (scale) { limit.min = scale.min_value; limit.max = scale.max_value; limit.step = "any"; }
}
async function loadProgramIntoForm() {
  try {
    const meta = await loadMeta();
    document.getElementById("grade_scale").innerHTML = '<option value="">Choose...</option>' +
      meta.grade_scales.map((s) => `<option value="${escapeHtml(s.scale_id)}">${escapeHtml(s.label)}</option>`).join("");
    fillSelect("location_req", meta.location_req_choices);
    fillSelect("eligible_field", meta.fields);
    fillSelect("status", meta.statuses);
    document.getElementById("status").value = "Open";
    document.getElementById("grade_scale").addEventListener("change", showScaleHint);
    if (!editingId) return;
    document.getElementById("form-title").textContent = "Edit scholarship program";
    original = await apiFetch(`/api/scholarships/${editingId}`);
    for (const f of ["scholarship_name", "provider", "grade_scale", "gwa_limit", "income_cap",
                     "eligible_field", "location_req", "min_entrance", "available_slots",
                     "status", "application_deadline"]) {
      document.getElementById(f).value = original[f] == null ? "" : original[f];
    }
    showScaleHint();
    const years = String(original.eligible_years).split(",");
    document.querySelectorAll('input[name="eligible_years"]').forEach((c) => { c.checked = years.includes(c.value); });
  } catch (err) { showError("program-message", err); }
}
document.getElementById("program-form").addEventListener("submit", async (e) => {
  e.preventDefault();
  const val = (id) => document.getElementById(id).value.trim();
  const payload = {
    scholarship_name: val("scholarship_name"), provider: val("provider"),
    grade_scale: val("grade_scale"), gwa_limit: parseFloat(val("gwa_limit")),
    income_cap: parseFloat(val("income_cap")), eligible_field: val("eligible_field"),
    eligible_years: [...document.querySelectorAll('input[name="eligible_years"]:checked')].map((c) => c.value),
    location_req: val("location_req"), min_entrance: parseInt(val("min_entrance"), 10),
    available_slots: parseInt(val("available_slots"), 10), status: val("status") || "Open",
    application_deadline: val("application_deadline") || null,
  };
  if (original && RULE_FIELDS.some((f) => String(payload[f]) !== String(original[f]) &&
      !(["gwa_limit", "income_cap"].includes(f) && parseFloat(payload[f]) === parseFloat(original[f])) &&
      !(f === "eligible_years" && payload[f].join(",") === String(original[f])))) {
    if (!confirm("Changing the rules clears this program's screening and ranking. Save anyway?")) return;
  }
  try {
    const r = await apiFetch(editingId ? `/api/scholarships/${editingId}` : "/api/scholarships", {
      method: editingId ? "PUT" : "POST", headers: JSON_HEADERS, body: JSON.stringify(payload) });
    if (!editingId) { window.location.href = `applicants.html?scholarship=${r.scholarship_id}`; return; }
    let msg = "Saved.";
    if (r.screening_cleared) msg += " The rules changed, so the earlier screening and ranking were cleared. Run Screening again.";
    else if (r.ranking_cleared) msg += " The number of slots changed, so the earlier ranking was cleared. Run Ranking again.";
    showMessage("program-message", msg);
    original = await apiFetch(`/api/scholarships/${editingId}`);
  } catch (err) { showError("program-message", err); }
});
document.addEventListener("DOMContentLoaded", loadProgramIntoForm);
</script></body></html>
