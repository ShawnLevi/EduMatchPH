<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EduMatch PH — Administrator login</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet"><link rel="stylesheet" href="style.css"></head>
<body>
<div class="page">
  <div class="brand-panel">
    <div class="brand-mark"><span class="brand-mark-dot"></span><span class="brand-mark-dot"></span></div>
    <h1>EduMatch PH</h1>
    <p class="tagline">Scholarship applicant screening and priority ranking for administrators.</p>
    <ul class="brand-points">
      <li>Six eligibility criteria checked with clear reasons</li>
      <li>Eligible applicants ranked by a priority score</li>
      <li>You make the final decision</li>
    </ul>
  </div>
  <div class="auth-panel"><div class="auth-card">
    <img class="login-logo" src="EduMatchPH_logo.jpg" alt="EduMatch PH">
    <form id="login-form" class="panel" novalidate>
      <h2 class="card-title">Administrator log in</h2>
      <div class="field"><label>Organization</label>
        <div class="org-pick">
          <input type="radio" name="org" id="org-uclm" value="uclm" checked><label for="org-uclm">UCLM<small>University of Cebu Lapu-Lapu and Mandaue</small></label>
          <input type="radio" name="org" id="org-dost" value="dost"><label for="org-dost">DOST<small>Dept. of Science and Technology</small></label>
        </div></div>
      <div class="field"><label for="login-email">Email</label>
        <input type="email" id="login-email" autocomplete="username" placeholder="name@organization.edu.ph" required></div>
      <div class="field"><label for="login-password">Password</label>
        <div class="pw-wrap"><input type="password" id="login-password" autocomplete="current-password" required>
          <button class="pw-toggle" id="pw-toggle" type="button" aria-label="Show password">Show</button></div>
        <span class="caps" id="caps" hidden>Caps Lock is on</span></div>
      <div id="login-message" class="alert error" role="alert" hidden></div>
      <button class="btn-primary" id="login-btn" type="submit">Log in</button>
    </form>
  </div></div>
</div>
<script src="app.js"></script>
<script>
const last = store("edumatch_org");
if (last) { const r = document.querySelector('input[name=org][value="' + last + '"]'); if (r) r.checked = true; }
const pw = document.getElementById("login-password"), form = document.getElementById("login-form");
document.getElementById("pw-toggle").addEventListener("click", (e) => {
  const show = pw.type === "password"; pw.type = show ? "text" : "password"; e.target.textContent = show ? "Hide" : "Show";
});
pw.addEventListener("keyup", (e) => { document.getElementById("caps").hidden = !(e.getModifierState && e.getModifierState("CapsLock")); });
function fail(text) {
  const m = document.getElementById("login-message"); m.textContent = text; m.hidden = false;
  form.classList.remove("shake"); void form.offsetWidth; form.classList.add("shake");
}
form.addEventListener("submit", async (e) => {
  e.preventDefault();
  document.getElementById("login-message").hidden = true;
  const email = document.getElementById("login-email").value.trim(), org = document.querySelector("input[name=org]:checked").value;
  if (!email || !pw.value) { fail("Enter your email and password."); return; }
  await withLoading(document.getElementById("login-btn"), async () => {
    try { await login(org, email, pw.value); store("edumatch_org", org); window.location.href = "programs.html"; }
    catch (err) { fail(friendlyError(err)); }
  });
});
</script>
</body></html>
