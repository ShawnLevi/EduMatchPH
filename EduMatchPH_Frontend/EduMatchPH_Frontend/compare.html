<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Compare — EduMatch PH</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css"></head>
<body><div id="shell"></div><main class="wrap">
<div id="prog-head"></div>
<h2 style="margin-bottom:.2rem">Compare applicants</h2>
<p class="lede">Pick two ranked applicants and see what separates them.</p>
<div class="card">
  <div class="grid2">
    <div class="field"><label for="compare-a">Applicant A</label><select id="compare-a"></select></div>
    <div class="field"><label for="compare-b">Applicant B</label><select id="compare-b"></select></div>
  </div>
  <div class="toolbar" style="margin-top:.8rem"><button class="btn-secondary small" id="swap" type="button">⇄ Swap</button><span class="hint">Results update when you change a choice.</span></div>
  <div id="compare-message" class="msg"></div>
</div>
<div id="compare-box"></div>
</main>
<script src="app.js"></script>
<script>
const scholarshipId = getScholarshipIdFromUrl();
if (!scholarshipId) window.location.href = "programs.html";
const CRITERION_ROWS = [["GWA", "GWA"], ["Entrance score", "Entrance Score"], ["Household income (PHP)", "Income"], ["Course", "Field"], ["Year level", "Year Level"], ["Location", "Location"]];
const A = document.getElementById("compare-a"), B = document.getElementById("compare-b"), msg = document.getElementById("compare-message");
let screeningCache = null, shortlist = [];
const sign = (n) => (n > 0 ? "+" : "") + n;
const valueOf = (s, name) => { const r = s.reasons.find((x) => x.criterion_name === name); return r ? r.applicant_value : ""; };

function card(p, other, lead) {
  const win = (mine, theirs, lowerWins) => (lowerWins ? mine < theirs : mine > theirs) ? "win" : "";
  return `<div class="cmp-card ${lead ? "lead" : ""}"><h3>${escapeHtml(p.name)}</h3>` +
    `<span class="pill ${p.ex.status === "SHORTLIST" ? "ok" : "wait"}">${escapeHtml(STATUS_LABELS[p.ex.status])}</span>` +
    `<div class="cmp-rows"><div class="cmp-row"><span>Rank</span><b class="${win(p.ex.rank_position, other.ex.rank_position, true)}">#${p.ex.rank_position}</b></div>` +
    `<div class="cmp-row"><span>Priority score</span><b class="${win(p.ex.priority_score, other.ex.priority_score)}">${p.ex.priority_score}</b></div>` +
    CRITERION_ROWS.map(([l, k]) => `<div class="cmp-row"><span>${l}</span><b>${escapeHtml(valueOf(p.sc, k))}</b></div>`).join("") + `</div></div>`;
}
function renderComparison(a, b) {
  const maxAbs = Math.max(...a.ex.effects.map((x) => Math.abs(x.effect_points)), ...b.ex.effects.map((x) => Math.abs(x.effect_points)), 1);
  let best = 0, gap = -1;
  a.ex.effects.forEach((ea, i) => { const d = Math.abs(ea.effect_points - b.ex.effects[i].effect_points); if (d > gap) { gap = d; best = i; } });
  const lead = a.ex.priority_score >= b.ex.priority_score ? a : b;
  return `<div class="insight">The biggest difference is <b>${escapeHtml(a.ex.effects[best].label)}</b> (${sign(a.ex.effects[best].effect_points)} for ${escapeHtml(a.name)} vs ${sign(b.ex.effects[best].effect_points)} for ${escapeHtml(b.name)}). ` +
    `${escapeHtml(lead.name)} leads by ${Math.abs(a.ex.priority_score - b.ex.priority_score).toFixed(2)} points.</div>` +
    `<div class="compare-grid">${card(a, b, lead === a)}${card(b, a, lead === b)}</div>` +
    `<div class="card" style="margin-top:1rem"><h3>What moved the score</h3><p class="hint">Priority points compared with the average eligible applicant. Bars grow outward from the middle.</p><div class="cmp-bars">` +
    `<b style="text-align:right">${escapeHtml(a.name)}</b><span></span><b>${escapeHtml(b.name)}</b>` +
    a.ex.effects.map((ea, i) => { const eb = b.ex.effects[i];
      return `<div class="half left"><i style="width:${Math.abs(ea.effect_points) / maxAbs * 100}%;${ea.effect_points < 0 ? "background:var(--no)" : ""}"></i></div><div class="lab">${escapeHtml(ea.label)}<br><span class="pts">${sign(ea.effect_points)} / ${sign(eb.effect_points)}</span></div>` +
        `<div class="half right"><i style="width:${Math.abs(eb.effect_points) / maxAbs * 100}%;${eb.effect_points < 0 ? "background:var(--no)" : ""}"></i></div>`; }).join("") +
    `</div><p class="hint" style="margin-top:1rem"><i>${escapeHtml(a.ex.note)}</i></p></div>`;
}
async function compare() {
  msg.textContent = "";
  const box = document.getElementById("compare-box");
  if (!A.value || !B.value) return;
  if (A.value === B.value) { box.innerHTML = ""; msg.textContent = "Choose two different applicants."; return; }
  box.innerHTML = '<div class="compare-grid"><div class="cmp-card"><div class="skeleton" style="height:220px"></div></div><div class="cmp-card"><div class="skeleton" style="height:220px"></div></div></div>';
  history.replaceState(null, "", `?scholarship=${encodeURIComponent(scholarshipId)}&a=${A.value}&b=${B.value}`);
  try {
    const base = `/api/scholarships/${scholarshipId}`;
    const [screening, ea, eb] = await Promise.all([screeningCache || apiFetch(`${base}/screening`), apiFetch(`${base}/applicants/${A.value}/explanation`), apiFetch(`${base}/applicants/${B.value}/explanation`)]);
    screeningCache = screening;
    const pick = (id) => screening.find((s) => String(s.applicant_id) === String(id));
    const sa = pick(A.value), sb = pick(B.value);
    box.innerHTML = renderComparison({ name: sa.full_name, ex: ea, sc: sa }, { name: sb.full_name, ex: eb, sc: sb });
  } catch (err) { box.innerHTML = ""; showError("compare-message", err); }
}
[A, B].forEach((s) => s.addEventListener("change", compare));
document.getElementById("swap").addEventListener("click", () => { const t = A.value; A.value = B.value; B.value = t; compare(); });

(async () => {
  await renderShell("compare");
  try {
    shortlist = await apiFetch(`/api/scholarships/${scholarshipId}/shortlist`);
    if (shortlist.length < 2) {
      document.getElementById("compare-box").innerHTML = `<div class="card empty"><div class="ico">${ICON.inbox}</div><h3>Not enough ranked applicants</h3><p>You need at least 2 ranked applicants to compare. Run screening and ranking first.</p><a class="btn-primary" href="ranking.html?scholarship=${encodeURIComponent(scholarshipId)}">Go to ranking</a></div>`;
      A.disabled = B.disabled = true; document.getElementById("swap").disabled = true; return;
    }
    const options = shortlist.map((r) => `<option value="${r.applicant_id}">#${r.rank_position} ${escapeHtml(r.full_name)}</option>`).join("");
    A.innerHTML = B.innerHTML = options;
    const qs = new URLSearchParams(location.search), has = (v) => shortlist.some((r) => String(r.applicant_id) === v);
    A.value = has(qs.get("a")) ? qs.get("a") : String(shortlist[0].applicant_id);
    B.value = has(qs.get("b")) ? qs.get("b") : String(shortlist[1].applicant_id);
    compare();
  } catch (err) { showError("compare-message", err); }
})();
</script></body></html>
